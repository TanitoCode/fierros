<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Fierros — seguimiento de gimnasio</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="App para registrar tus entrenamientos, rutinas y progreso en el gimnasio, con gráficas y récords personales.">

<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e0f13" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fierros">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon.png" sizes="any">

<!-- Fuentes -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9v6M7 5v14M17 5v14M20 9v6M7 12h10"/></svg>
      <b>Fierros</b>
    </div>
    <button class="icon-btn" id="backupBtn" title="Respaldo" aria-label="Respaldo">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
    </button>
    <button class="icon-btn" id="themeBtn" title="Tema" aria-label="Cambiar tema">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <main>
    <section class="view active" id="view-hoy"></section>
    <section class="view" id="view-rutinas"></section>
    <section class="view" id="view-progreso"></section>
    <section class="view" id="view-cuerpo"></section>
  </main>

  <nav class="tabs">
    <button class="tab active" data-tab="hoy">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6M7 5v14M17 5v14M20 9v6M7 12h10"/></svg>
      Hoy
    </button>
    <button class="tab" data-tab="rutinas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v16"/></svg>
      Rutinas
    </button>
    <button class="tab" data-tab="progreso">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5M4 19h16M8 15l3-4 3 2 4-6"/></svg>
      Progreso
    </button>
    <button class="tab" data-tab="cuerpo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="6" r="3"/><path d="M12 9v7M8 20l4-4 4 4M9 12h6"/></svg>
      Cuerpo
    </button>
  </nav>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<div class="rest-bar" id="restBar">
  <div class="rest-card" id="restCard">
    <div class="rest-info">
      <span class="rest-label" id="restLabel">Descanso</span>
      <span class="rest-time tnum" id="restTime">00:00</span>
    </div>
    <button class="rest-btn" id="restMinus" aria-label="Restar 15 segundos">−15</button>
    <button class="rest-btn" id="restPlus" aria-label="Sumar 15 segundos">+15</button>
    <button class="rest-btn" id="restSkip" aria-label="Saltar descanso">Saltar</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
